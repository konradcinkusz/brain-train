# ============================================================
#  Build the book on a version tag and attach it to the release.
#
#  THREE THINGS CHANGED HERE, each for a recorded reason:
#
#  1. The trigger matches `v*` AND `V*`. A tag pushed in the other case matches
#     neither pattern a `v*`-only workflow declares, the workflow never runs,
#     and the release ships with nothing attached -- a failure mode recorded in
#     the estate and indistinguishable, from the outside, from a build that
#     failed.
#
#  2. `contents: write` sits on the RELEASE JOB, not at the top level. The
#     build job publishes nothing and does not need it.
#
#  3. The gate is tools/checklog.py, not latexmk's exit code. v1.0.0 is the
#     worked example of why: its build failed, the release job never ran
#     because it declares `needs: build`, and the release was left carrying no
#     assets at all while the README went on advertising a PDF badge. Anything
#     that reaches a release here has been through the same three checks a pull
#     request goes through.
#
#  WHAT IT SHIPS. The book (book/main-pl-a4.tex), which builds. The Beamer deck
#  does NOT build -- see issue #21, where XeLaTeX is driven against a T1 font
#  stack that has no Polish glyphs -- so it is not wired in here. Whether the
#  deck is fixed, generated from the book, or retired is issue #16.
#
#  THE ASSET NAME is year-agnostic on purpose. If issue #8 settles on annual
#  editions, the year lands in ASSET below and nowhere else.
#
#  4. IT CAN BE RUN BY HAND, and that is not a convenience. Pushing a tag from
#     a Claude Code web session returns HTTP 403 -- the session's git
#     credentials carry branch access and not tag access -- so a session could
#     prepare a release end to end and could not cut one, and CLAUDE.md carried
#     that as a standing limitation with a manual command beside it. The
#     workflow's own GITHUB_TOKEN has `contents: write`, and
#     softprops/action-gh-release creates the tag it is given. So the release
#     is now cuttable from anywhere, by anybody who can run a workflow, with
#     the same three gates in front of it.
#
#     The version is a REQUIRED input rather than something derived. A release
#     is the one thing here that cannot be taken back, and a workflow that
#     guesses its own version number is a workflow that publishes on a
#     misclick.
# ============================================================
name: Release book PDF

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja do wydania, np. v2.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  ASSET: trening-mozgu-a4.pdf
  ASSET_ADV: trening-mozgu-zaawansowany-a4.pdf

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generated sets are up to date
        run: |
          python3 tools/gen_sets.py --check
          python3 tools/gen_sets_adv.py --check

      - name: The plans match the sets they name
        run: |
          python3 tools/gen_plan.py --check
          python3 tools/gen_plan.py --check --volume adv

      - name: Every printed answer re-computed from its printed question
        run: python3 tools/checkanswers.py

      - name: Build both volumes
        # Step level, not an action input: latexmk's exit code is not the gate.
        # Keep going far enough to produce a log, then let checklog.py decide.
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: book
          root_file: |
            main-pl-a4.tex
            main-pl-a4-adv.tex
          latexmk_use_xelatex: false

      - name: Read both logs properly
        run: |
          python3 tools/checklog.py book/main-pl-a4.log
          python3 tools/checklog.py book/main-pl-a4-adv.log

      - name: Name the assets
        run: |
          mv book/main-pl-a4.pdf "$ASSET"
          mv book/main-pl-a4-adv.pdf "$ASSET_ADV"

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_ADV }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # The only job that publishes, and the only one that can write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book

      # if-no-files-found: error above already refuses to upload an empty
      # artifact, so a release cannot be created from nothing. v1.0.0 shipped
      # with an empty asset list and this is the step that would have caught it.
      # BOTH, and by size. `if-no-files-found: error` above refuses an empty
      # artifact, but it would happily upload one of two.
      - name: The assets exist
        run: |
          test -s "$ASSET"
          test -s "$ASSET_ADV"

      # tag_name is explicit because it has to serve both triggers: on a tag
      # push github.ref_name IS the tag, but on a manual run it is the branch
      # the workflow was dispatched from, and a release tagged `main` is not a
      # release anybody can go back to.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_ADV }}
          fail_on_unmatched_files: true
